bundle:
  name: knowledge-agent

variables:
  serving_endpoint_name:
    description: "Name of the model serving endpoint to be used by the app"
    default: "ka-bd75d20a-endpoint"
  pdf_volume_name:
    description: "Full Unity Catalog path to the PDF Volume"
    default: "poc.agent_files.all_files"
  resource_name_suffix:
    description: "Suffix for resource names"
    default: "dev"

resources:
  apps:
    knowledge_agent_app:
      name: knowledge-agent-${var.resource_name_suffix}
      description: "AI-powered chatbot application with PDF Preview"
      source_code_path: .
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: pdf-volume
          uc_securable:
            securable_full_name: ${var.pdf_volume_name}
            securable_type: VOLUME
            permission: READ_VOLUME

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: agent-dev
      host: https://dbc-2d78c719-5ef2.cloud.databricks.com

  prod:
    mode: production
    variables:
      resource_name_suffix: prod